<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Runner">
<meta name="description" content="NEON RUNNER — a retro auto-fire side-scrolling shooter. Move, jump, duck. Your gun fires itself.">
<title>NEON RUNNER — Auto-Fire Side-Shooter</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05060d;
    font-family:"Courier New",Courier,monospace;color:#cfe6ff;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
    touch-action:none;overscroll-behavior:none;
  }
  canvas#c{
    position:fixed;inset:0;display:block;width:100%;height:100%;background:#000;
    image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;
  }
  #touch{
    position:fixed;left:0;right:0;bottom:0;display:none;align-items:flex-end;
    justify-content:space-between;pointer-events:none;z-index:10;--bs:78px;
    padding:12px calc(14px + env(safe-area-inset-right))
            calc(14px + env(safe-area-inset-bottom))
            calc(14px + env(safe-area-inset-left));
  }
  body.touch #touch{display:flex}
  body.touch.lefty #touch{flex-direction:row-reverse}
  #touch .pad{display:flex;gap:12px;pointer-events:auto}
  #touch .mid{display:flex;gap:10px;pointer-events:auto;padding-bottom:6px}
  #touch button{
    width:var(--bs);height:var(--bs);border-radius:50%;padding:0;
    font-family:inherit;font-weight:bold;font-size:calc(var(--bs)*0.36);line-height:1;
    display:flex;align-items:center;justify-content:center;
    background:rgba(24,48,92,calc(0.48 * var(--ba,1)));color:#9fe8ff;
    border:2px solid rgba(90,220,255,0.42);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    touch-action:none;
  }
  #touch button.on{background:rgba(90,220,255,0.34);color:#fff;border-color:rgba(150,245,255,0.9)}
  #touch button.small{width:calc(var(--bs)*0.72);height:calc(var(--bs)*0.72);font-size:calc(var(--bs)*0.26)}
  #a11y{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
        clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"></div>
<div id="a11y" aria-live="polite" role="status"></div>
<script>
"use strict";
(function(){
