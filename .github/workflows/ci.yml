name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the single-file game
        run: npm run build

      - name: Run the core harness
        run: node tests/harness-core.js

      - name: Run the full audit
        run: node tests/harness-audit.js

      - name: Minify and verify the minified bundle
        run: |
          npm run minify
          GAME_JS=build/game.hook.min.js node tests/harness-core.js
          GAME_JS=build/game.hook.min.js node tests/harness-audit.js

      - name: Check balance has not regressed
        run: node tests/speed-probe.js

      - name: Upload the built game
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # was @v7.0.2
        with:
          name: neon-runner-dist
          path: |
            build/neon-runner.min.html
            build/neon-runner.html
          if-no-files-found: error
