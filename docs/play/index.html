<script>
/* A SMOKE TEST, not a feature test: did the page come up, are the kits loaded, does storage work.
   Open with ?test to see it. */
window.__smokeTest = function () {
  var out = [];
  function ok(n, c) { out.push((c ? "PASS " : "FAIL ") + n); }
  ok("the document rendered", !!document.body && document.body.children.length > 0);
  ok("a heading is present", !!document.querySelector("h1, h2"));
  ok("no script threw during load", !window.__bootError);
  var kits = ["Export","Loom","CryptoKit","Case","Search","Srs","Game","Art","Audio","Ml","UI","Lan","Astro"];
  var found = kits.filter(function (k) { return window[k]; });
  ok("at least one kit is loaded (" + (found.join(", ") || "none") + ")", found.length > 0);
  try { localStorage.setItem("__smoke","1"); ok("storage works", localStorage.getItem("__smoke") === "1"); localStorage.removeItem("__smoke"); }
  catch (e) { ok("storage works", false); }
  console.log(out.join("\n"));
  if (location.search.indexOf("test") >= 0) {
    var d = document.createElement("pre"); d.textContent = out.join("\n");
    d.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#111;color:#eee;padding:12px;font:12px ui-monospace,monospace;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap";
    document.body.appendChild(d);
  }
  return out;
};
window.addEventListener("error", function () { window.__bootError = true; });
</script>
<style id="app-theme">
  /* neon-runner - its own palette, type and shape.
     Keyed on data-theme so the in-app theme toggle still works; !important is
     required because web-kit sets these as inline styles on <html>. */
  html[data-theme="dark"]{--bg:#051218 !important;--card:#051f26 !important;--ink:#eefafc !important;--mut:#4fa3ba !important;--line:#05303a !important;--acc:#4ccae0 !important;}
  html[data-theme="light"]{--bg:#f4fcfd !important;--card:#ffffff !important;--ink:#0a232d !important;--mut:#2499b2 !important;--line:#dcf5f9 !important;--acc:#0595ae !important;}
  html,body{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace !important;letter-spacing:.04em !important;
    background-image:radial-gradient(820px 360px at 50% -170px,
      color-mix(in srgb, var(--acc) 16%, transparent), transparent 72%) !important;
    background-repeat:no-repeat !important;background-attachment:fixed !important}
  button,input,textarea,select{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace !important}
  button,.btn{border-radius:2px !important}
  input,textarea,select{border-radius:2px !important}
  .card,[class*="card"]{border-radius:4px !important}
  button:not(.ghost):not(.tab){background:var(--acc) !important}
</style>
